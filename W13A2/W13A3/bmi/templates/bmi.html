{% extends "base.html" %}

{% block title %}BMI Calculator{% endblock %}

{% block content %}
<h1>BMI Calculator</h1>

<form method="POST">
    {% csrf_token %}
    <div class="form-group">
        <label for="weight">Weight (kg)</label>
        <input type="number" id="weight" name="weight" step="0.1" min="1"
               placeholder="e.g. 70" value="{{ weight }}" required>
    </div>
    <div class="form-group">
        <label for="height">Height (cm)</label>
        <input type="number" id="height" name="height" step="0.1" min="1"
               placeholder="e.g. 170" value="{{ height }}" required>
    </div>
    <button type="submit">Calculate BMI</button>
</form>

{% if bmi %}
<div class="result">
    <div class="bmi-value">{{ bmi }}</div>
    <div class="bmi-category">{{ category }}</div>
</div>
{% elif category == "Invalid input" %}
<div class="result">
    <div class="bmi-category">{{ category }}</div>
</div>
{% endif %}
{% endblock %}
